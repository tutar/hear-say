name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Validate release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $expected_tag" >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists and will not be overwritten." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit and component tests
        run: pnpm test

      - name: Build release archive
        run: |
          set -euo pipefail
          pnpm exec wxt zip
          archive=$(find .output -maxdepth 1 -type f -name '*-chrome.zip' -print -quit)
          if [[ -z "$archive" ]]; then
            echo "WXT did not produce a Chrome ZIP archive." >&2
            exit 1
          fi
          mv "$archive" "hear-say-${RELEASE_TAG}-chrome.zip"

      - name: Generate release notes
        id: git-cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip header
          github_token: ${{ github.token }}
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=(--verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          gh release create "$RELEASE_TAG" "hear-say-${RELEASE_TAG}-chrome.zip" "${release_flags[@]}"
