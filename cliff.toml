[changelog]
body = """
## Highlights
{% set features = commits | filter(attribute="group", value="Features") -%}
{% if features | length == 0 -%}
- This release focuses on fixes and maintenance improvements.
{% else -%}
{% for commit in features -%}
- {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/tutar/hear-say/commit/{{ commit.id }}))
{% endfor -%}
{% endif %}
{% for group, grouped_commits in commits | group_by(attribute="group") -%}
### {{ group }}
{% for commit in grouped_commits -%}
- {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/tutar/hear-say/commit/{{ commit.id }}))
{% endfor -%}
{% endfor -%}
### Contributors
{% for author, author_commits in commits | group_by(attribute="author.name") -%}
- {{ author }}
{% endfor -%}
{% if previous.version -%}
**Full Changelog**: https://github.com/tutar/hear-say/compare/{{ previous.version }}...{{ version }}
{% endif -%}
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^doc", group = "Other Changes" },
  { message = "^test", group = "Other Changes" },
  { message = "^refactor", group = "Other Changes" },
  { message = "^chore", group = "Other Changes" },
  { message = ".*", group = "Other Changes" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
